name: Publish EAS Update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: Update message
        required: false
        default: Manual update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG="$INPUT_MESSAGE"
          if [ -z "$MSG" ]; then
            MSG=$(printf '%s' "$COMMIT_MESSAGE" | head -1)
          fi
          if [ -z "$MSG" ]; then
            MSG="Update"
          fi
          eas update --branch preview --non-interactive --message "$MSG"
