name: Publish EAS Update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: Update message
        required: false
        default: Manual update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        run: eas update --branch preview --non-interactive --message "${{ github.event.inputs.message || github.event.head_commit.message || 'Update' }}"
